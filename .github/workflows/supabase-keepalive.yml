name: Supabase Keep Alive

on:
  schedule:
    # 每 5 天执行一次（UTC 时间每周一和周六的 8:00）
    - cron: '0 8 */5 * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_data?select=key&limit=1")
          echo "Supabase responded with HTTP $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
            echo "✅ Supabase is alive!"
          else
            echo "⚠️ Unexpected status: $response"
            exit 1
          fi
